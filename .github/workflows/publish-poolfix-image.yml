name: Publish 0.7.2 poolfix image

on:
  push:
    tags:
      - "0.7.2-poolfix.1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-poolfix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Verify pinned release inputs
        shell: bash
        run: |
          test "$(cat VERSION)" = "0.7.2"
          test "${GITHUB_REF_NAME}" = "0.7.2-poolfix.1"

      - name: Verify formatting
        shell: bash
        run: |
          test -z "$(gofmt -l pkg/whatsmeow/service/whatsmeow.go pkg/whatsmeow/service/auth_container_retry_test.go)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/conectalab-saas/evolution-go:0.7.2-poolfix.1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.7.2-poolfix.1
          build-args: VERSION=0.7.2-poolfix.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record image digest
        shell: bash
        run: echo "Image digest ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
