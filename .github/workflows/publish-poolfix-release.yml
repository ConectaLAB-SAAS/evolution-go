name: Publish 0.7.2 poolfix release assets

on:
  push:
    tags:
      - "release-assets-0.7.2-poolfix.2"

permissions:
  contents: write
  packages: read

concurrency:
  group: publish-poolfix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Extract and publish linux-amd64 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_IMAGE: ghcr.io/conectalab-saas/evolution-go@sha256:8d5b1b374c284fdedcafc4748894c2162893635fdde556d5bb185d62d389188a
      SOURCE_DIGEST: sha256:8d5b1b374c284fdedcafc4748894c2162893635fdde556d5bb185d62d389188a
      SOURCE_COMMIT: 04d669a4462a297551a16a618b2520f1fc96ccac
      RELEASE_TAG: 0.7.2-poolfix.2
      ARCHIVE_NAME: evolution-go-poolfix-linux-amd64.tar.gz

    steps:
      - name: Verify immutable inputs and release absence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          test "${GITHUB_REF_NAME}" = "release-assets-0.7.2-poolfix.2"

          release_error="${RUNNER_TEMP}/release-error.txt"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>"${release_error}"; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          if ! grep -q "HTTP 404" "${release_error}"; then
            cat "${release_error}" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq ".object.sha" >/dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and validate linux-amd64 payload
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          assets_dir="${RUNNER_TEMP}/release-assets"
          payload_dir="${RUNNER_TEMP}/payload"
          container_name="poolfix-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive_path="${assets_dir}/${ARCHIVE_NAME}"
          checksum_path="${archive_path}.sha256"

          mkdir -p "${assets_dir}" "${payload_dir}/manager"

          docker pull --platform linux/amd64 "${SOURCE_IMAGE}"
          docker create --platform linux/amd64 --name "${container_name}" "${SOURCE_IMAGE}" >/dev/null
          trap 'docker rm -f "${container_name}" >/dev/null 2>&1 || true' EXIT

          docker cp "${container_name}:/app/server" "${payload_dir}/server"
          docker cp "${container_name}:/app/manager/dist" "${payload_dir}/manager/dist"
          docker cp "${container_name}:/app/VERSION" "${payload_dir}/VERSION"

          test -x "${payload_dir}/server"
          test -s "${payload_dir}/VERSION"
          test "$(tr -d '\r\n' < "${payload_dir}/VERSION")" = "0.7.2"
          test -f "${payload_dir}/manager/dist/index.html"
          test -d "${payload_dir}/manager/dist/assets"
          server_description="$(file "${payload_dir}/server")"
          [[ "${server_description}" == *"ELF 64-bit LSB"* ]]
          [[ "${server_description}" == *"x86-64"* ]]

          tar -C "${payload_dir}" -czf "${archive_path}" server manager VERSION
          archive_listing="${assets_dir}/archive-contents.txt"
          tar -tzf "${archive_path}" > "${archive_listing}"
          grep -Fxq "server" "${archive_listing}"
          grep -Fxq "manager/dist/index.html" "${archive_listing}"
          grep -Fxq "VERSION" "${archive_listing}"

          (
            cd "${assets_dir}"
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            sha256sum --check "${ARCHIVE_NAME}.sha256"
          )

          checksum="$(cut -d ' ' -f 1 "${checksum_path}")"
          test "${#checksum}" -eq 64

          echo "archive_path=${archive_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${checksum_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"

      - name: Create public GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_PATH: ${{ steps.bundle.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.bundle.outputs.checksum_path }}
          CHECKSUM: ${{ steps.bundle.outputs.checksum }}
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/release-notes.md"
          cat > "${notes_file}" <<'EOF'
          Public linux/amd64 runtime bundle extracted from the immutable Evolution Go poolfix container image. The binary was not rebuilt during release publication.

          - Source image: `ghcr.io/conectalab-saas/evolution-go@sha256:8d5b1b374c284fdedcafc4748894c2162893635fdde556d5bb185d62d389188a`
          - Source digest: `sha256:8d5b1b374c284fdedcafc4748894c2162893635fdde556d5bb185d62d389188a`
          - Source commit: [`04d669a4462a297551a16a618b2520f1fc96ccac`](https://github.com/ConectaLAB-SAAS/evolution-go/commit/04d669a4462a297551a16a618b2520f1fc96ccac)
          - Platform: `linux/amd64`

          Verify the downloaded archive with the attached `.sha256` file before deployment.
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          gh release create "${RELEASE_TAG}" \
            "${ARCHIVE_PATH}#Linux amd64 runtime bundle" \
            "${CHECKSUM_PATH}#SHA-256 checksum" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Evolution Go 0.7.2 poolfix.2" \
            --notes-file "${notes_file}"

          {
            echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "Archive SHA-256: \`${CHECKSUM}\`"
            echo "Source digest: \`${SOURCE_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
